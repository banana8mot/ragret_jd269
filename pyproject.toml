[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "banana8mot-ragret_jd269"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出RAG 检索工程师·流水线的数据倾斜上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "banana8mot" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://banana8mot.github.io"
Repository = "https://github.com/banana8mot/ragret_jd269"
Issues = "https://github.com/banana8mot/ragret_jd269/issues"

[project.scripts]
ragret_jd269 = "ragret_jd269:main"

[tool.setuptools]
py-modules = ["ragret_jd269"]
